<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Registration &mdash; CIVICFIX</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background: var(--bg-page); min-height: 100vh; display: flex; flex-direction: column;">
  <div id="demo-role-bar"></div>
  <header class="header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="card" style="max-width: 580px; width: 100%; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.3rem;">CF</div>
        <h2 style="font-size: 1.5rem; margin-bottom: 6px;">Citizen Account Registration</h2>
        <p style="font-size: 0.9rem;">Join CIVICFIX to report infrastructure issues, track resolutions, and rate municipal service.</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+1-555-0199" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="jane.doe@example.com" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-city">City <span class="required">*</span></label>
            <input type="text" id="reg-city" class="form-control" value="Metro City" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-area">Area / Ward <span class="required">*</span></label>
            <input type="text" id="reg-area" class="form-control" placeholder="e.g. Central Ward, East District" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" minlength="6" required />
          </div>
        </div>

        <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Create Citizen Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>CIVICFIX Local Issue Resolution System</div>
      <div>&copy; 2026 Municipal Administration</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const city = document.getElementById('reg-city').value.trim();
      const area = document.getElementById('reg-area').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const btn = document.getElementById('btn-reg-submit');

      if (password !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const payload = { fullName, phone, email, city, area, password };
        const res = await API.register(payload);
        if (res.success && res.data) {
          showToast('Registration successful! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/citizen/dashboard.html';
          }, 600);
        }
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Citizen Account';
      }
    }
  </script>
</body>
</html>
