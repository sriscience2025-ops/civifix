# CIVICFIX - Application Configuration
spring.application.name=civicfix
server.port=8085

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/civicfix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=civicfix_user
spring.datasource.password=civicfix_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=never

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
civicfix.upload.dir=uploads/

# Spring Security & JWT Configuration
civicfix.jwt.secret=9a3f9e8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f
civicfix.jwt.expiration-ms=86400000

# Logging
logging.level.com.civicfix=DEBUG
logging.level.org.springframework.security=INFO
